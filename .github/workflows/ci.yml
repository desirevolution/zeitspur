name: CI
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      # Smoke tests import predictable dist/assets/*.js module paths.
      # A Vite production build bundles and renames these files, so build
      # the standalone test target first and the production bundle last.
      - name: Build test modules, run smoke tests, and verify production build
        run: npm run test:ci
