name: Docker image and GitHub release
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing version tag (e.g. v0.33.0) to rebuild and upload release ZIPs'
        required: false
        type: string
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        run: node -e 'if ("v" + require("./package.json").version !== process.env.RELEASE_TAG) process.exit(1)'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build test modules, run smoke tests, and verify production build
        run: npm run test:ci

  publish-image:
    # Manual release-asset repair must not rebuild or retag the Docker image.
    if: inputs.release_tag == ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    concurrency:
      group: zeitspur-release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    # Static and portable release archives do not depend on multi-arch Docker publishing.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version tag
        run: node -e 'if ("v" + require("./package.json").version !== process.env.RELEASE_TAG) process.exit(1)'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Build and verify single-file portable version
        run: npm run build:portable && npm run test:portable
      - name: Archive standalone static files
        run: |
          cd dist
          zip -qr "${GITHUB_WORKSPACE}/zeitspur-${RELEASE_TAG}-static.zip" .
      - name: Archive portable HTML and instructions
        run: |
          cd portable
          zip -q "${GITHUB_WORKSPACE}/zeitspur-${RELEASE_TAG}-portable.zip" zeitspur.html README.txt
      - name: Publish or attach GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Inline intentionally: manual repair checks out the *old release tag*,
        # whose tree might not contain any newly added maintenance script.
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          static="zeitspur-${RELEASE_TAG}-static.zip"
          portable="zeitspur-${RELEASE_TAG}-portable.zip"
          test -s "$static"
          test -s "$portable"
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "Release exists: uploading/replacing assets"
            gh release upload "$RELEASE_TAG" "$static" "$portable" --clobber
          else
            echo "Release missing: creating it with assets"
            gh release create "$RELEASE_TAG" "$static" "$portable" --verify-tag --generate-notes
          fi
