<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#111915" />
    <meta name="description" content="Einfach Zeit erfassen. Privat, lokal und offline." />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-classic-192.png" sizes="192x192" />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>Zeitspur – Lokaler Time Tracker</title>
  </head>
  <body>
    <div id="app"><p class="loading">Zeitspur wird geladen …</p></div>
    <dialog id="editor-dialog" aria-labelledby="editor-title"></dialog>
    <dialog id="settings-dialog" aria-labelledby="settings-title"></dialog>
    <dialog id="help-dialog" aria-labelledby="help-title"></dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description"></dialog>
    <div id="update-banner" class="update-banner" role="status" aria-live="polite" hidden>
      <span>Update verfügbar</span>
      <div class="update-actions">
        <button type="button" class="button primary" id="update-apply">Aktualisieren</button>
        <button type="button" class="button outline" id="update-later">Später</button>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./src/main.ts"></script>
    <script type="module" src="./src/pwa-updates.ts"></script>
  </body>
</html>
