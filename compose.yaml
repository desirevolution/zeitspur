# End users: docker compose up -d
# For an unreleased branch build, use tag :main instead of :latest.
services:
  zeitspur:
    image: ghcr.io/desirevolution/zeitspur:latest
    restart: unless-stopped
    ports:
      - "${ZEITSPUR_BIND:-127.0.0.1}:${ZEITSPUR_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
